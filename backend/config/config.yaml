server:
  host: 0.0.0.0
  port: 8090
  max_upload_size: 10737418240  # 10GB
  production: false
  cors_origins:
    - "*"

storage:
  base_path: ${HOME}/losslesscut/storage
  auto_cleanup: false
  cleanup_after_days: 7

ffmpeg:
  path: ffmpeg
  ffprobe_path: ffprobe
  threads: 0  # 0 = auto

ytdlp:
  path: yt-dlp
  max_quality: 1080p
