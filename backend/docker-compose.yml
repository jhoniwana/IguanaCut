version: '3.8'

services:
  losslesscut:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8082"
    volumes:
      - ./data:/var/losslesscut
      - ./config:/etc/losslesscut
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
    environment:
      - LOSSLESSCUT_SERVER_PORT=8080
      - LOSSLESSCUT_STORAGE_BASE_PATH=/var/losslesscut
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
