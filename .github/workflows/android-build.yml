name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      NDK_VERSION: "27.1.12297006"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable yarn 4
        run: corepack enable

      - name: Install frontend deps
        run: yarn install

      - name: Build frontend (web)
        run: yarn build:web
        env:
          VITE_HIDE_URL_DOWNLOAD: "1"

      - name: Build backend (linux arm64, static)
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o /tmp/losslesscut-server-arm64 ./cmd/server

      - name: Install Android SDK + NDK
        run: |
          bash scripts/android/setup-android-sdk.sh
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Build FFmpeg for Android (arm64)
        run: bash scripts/android/build-ffmpeg-android.sh

      - name: Stage assets
        run: |
          mkdir -p android/app/src/main/assets/native android/app/src/main/assets/web
          cp /tmp/losslesscut-server-arm64 android/app/src/main/assets/native/server_arm64
          cp scripts/android/ffmpeg-dist/arm64-v8a/bin/ffmpeg android/app/src/main/assets/native/ffmpeg
          cp scripts/android/ffmpeg-dist/arm64-v8a/bin/ffprobe android/app/src/main/assets/native/ffprobe
          cp -r backend/web/. android/app/src/main/assets/web/

      - name: Gradle assemble (play flavor)
        run: |
          cd android
          ./gradlew :app:assemblePlayRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iguanacut-play-release
          path: android/app/build/outputs/apk/play/release/*.apk
